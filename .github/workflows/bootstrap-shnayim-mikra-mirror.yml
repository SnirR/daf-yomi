name: Bootstrap shnayim-mikra-app mirror

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Copy MIRROR_TOKEN to SnirR/shnayim-mikra-app
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from nacl import encoding, public

          token = os.environ["GH_TOKEN"]
          secret = os.environ["MIRROR_TOKEN"]
          repo = "SnirR/shnayim-mikra-app"

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)

          public_key = public.PublicKey(data["key"].encode("utf-8"), encoding.Base64Encoder())
          sealed_box = public.SealedBox(public_key)
          encrypted = base64.b64encode(sealed_box.encrypt(secret.encode("utf-8"))).decode("utf-8")

          body = json.dumps({"encrypted_value": encrypted, "key_id": data["key_id"]}).encode("utf-8")
          put = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/MIRROR_TOKEN",
              data=body,
              method="PUT",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(put) as resp:
              print("Set MIRROR_TOKEN on", repo, "status", resp.status)
          PY

      - name: Create SnirRadomsky/shnayim-mikra-app if missing
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${MIRROR_TOKEN}" \
            https://api.github.com/repos/SnirRadomsky/shnayim-mikra-app)
          if [ "$STATUS" = "404" ]; then
            curl -sf -H "Authorization: token ${MIRROR_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"shnayim-mikra-app","private":false,"description":"Mirror of SnirR/shnayim-mikra-app"}' \
              https://api.github.com/user/repos
          fi

      - name: Mirror SnirR/shnayim-mikra-app to SnirRadomsky
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git clone --bare https://github.com/SnirR/shnayim-mikra-app.git repo
          cd repo
          git push --mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/SnirRadomsky/shnayim-mikra-app.git"
